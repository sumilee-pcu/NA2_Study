<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">스위치와 라우터가 확인하는 주소</title><desc id="desc">같은 VLAN에서 스위치는 수신 포트 1의 출발지 MAC A를 학습하고 등록된 목적지 MAC B의 포트 3으로 프레임을 전달합니다. 라우터는 목적지 IP 192.168.10.77과 일치하는 /16과 /24 경로 중 더 긴 /24를 우선합니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">스위치와 라우터가 확인하는 주소</text><text x="32" y="91" font-size="23" fill="#087a61" text-anchor="start" font-weight="700">L2 스위치: 출발지 학습 → 목적지 조회</text><rect x="32" y="120" width="124" height="68" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="94" y="162" font-size="24" fill="#192d33" text-anchor="middle" font-weight="600">MAC A</text><rect x="278" y="120" width="164" height="68" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="360" y="162" font-size="24" fill="#103b37" text-anchor="middle" font-weight="700">스위치</text><rect x="564" y="120" width="124" height="68" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="626" y="162" font-size="24" fill="#192d33" text-anchor="middle" font-weight="600">MAC B</text><line x1="166" y1="155" x2="267" y2="155" stroke="#087a61" stroke-width="2.5" /><path d="M 259.01704569498645 159.15601257987333 L 267 155 L 259.01704569498645 150.84398742012667" fill="none" stroke="#087a61" stroke-width="2.5"/><line x1="452" y1="155" x2="553" y2="155" stroke="#087a61" stroke-width="2.5" /><path d="M 545.0170456949865 159.15601257987333 L 553 155 L 545.0170456949865 150.84398742012667" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="217" y="131" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">포트 1</text><text x="503" y="131" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">포트 3</text><text x="32" y="229" font-size="22" fill="#192d33" text-anchor="start" font-weight="400">학습: A → 포트 1</text><text x="374" y="229" font-size="22" fill="#192d33" text-anchor="start" font-weight="400">조회: B → 포트 3</text><text x="32" y="263" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">같은 VLAN · B가 이미 등록된 경우</text><line x1="32" y1="288" x2="688" y2="288" stroke="#dce4df" stroke-width="2.5" /><text x="32" y="329" font-size="23" fill="#103b37" text-anchor="start" font-weight="700">라우터: 목적지 IP와 가장 긴 접두부 비교</text><text x="32" y="369" font-size="23" fill="#192d33" text-anchor="start" font-weight="400">목적지 192.168.10.77</text><rect x="32" y="393" width="306" height="78" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="185" y="425" font-size="24" fill="#536b70" text-anchor="middle" font-weight="400">192.168.0.0/16</text><text x="185" y="456" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">일치</text><rect x="354" y="393" width="334" height="78" rx="8" fill="#e7f3ec" stroke="#087a61" stroke-width="1.5"/><text x="521" y="425" font-size="24" fill="#087a61" text-anchor="middle" font-weight="700">192.168.10.0/24</text><text x="521" y="456" font-size="20" fill="#087a61" text-anchor="middle" font-weight="600">더 긴 접두부 → 우선 선택</text><text x="32" y="504" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">장비 이름보다 수행하는 L2 스위칭·IP 라우팅 기능을 구분합니다.</text></g></svg>
