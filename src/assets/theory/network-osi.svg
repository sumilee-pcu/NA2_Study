<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">OSI와 TCP/IP의 계층 대응</title><desc id="desc">OSI 응용·표현·세션은 TCP/IP 응용, 전송은 전송, 네트워크는 인터넷, 데이터링크·물리는 링크 계층에 개념적으로 대응합니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">OSI와 TCP/IP의 계층 대응</text><text x="153" y="91" font-size="23" fill="#103b37" text-anchor="middle" font-weight="700">OSI 7계층</text><text x="555" y="91" font-size="23" fill="#103b37" text-anchor="middle" font-weight="700">TCP/IP 4계층</text><rect x="32" y="110" width="242" height="38" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="137" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">7  응용</text><rect x="32" y="156" width="242" height="38" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="183" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">6  표현</text><rect x="32" y="202" width="242" height="38" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="229" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">5  세션</text><rect x="32" y="248" width="242" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="275" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">4  전송</text><rect x="32" y="294" width="242" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="321" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">3  네트워크</text><rect x="32" y="340" width="242" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="367" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">2  데이터링크</text><rect x="32" y="386" width="242" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="153" y="413" font-size="22" fill="#192d33" text-anchor="middle" font-weight="400">1  물리</text><rect x="432" y="110" width="256" height="130" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="560" y="171" font-size="23" fill="#103b37" text-anchor="middle" font-weight="700">응용</text><text x="560" y="201" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">HTTP · DNS</text><rect x="432" y="248" width="256" height="38" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="451" y="274" font-size="22" fill="#103b37" text-anchor="start" font-weight="700">전송</text><text x="674" y="274" font-size="20" fill="#536b70" text-anchor="end" font-weight="400">TCP · UDP</text><rect x="432" y="294" width="256" height="38" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="451" y="320" font-size="22" fill="#103b37" text-anchor="start" font-weight="700">인터넷</text><text x="674" y="320" font-size="20" fill="#536b70" text-anchor="end" font-weight="400">IP</text><rect x="432" y="340" width="256" height="84" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="560" y="378" font-size="23" fill="#103b37" text-anchor="middle" font-weight="700">링크</text><text x="560" y="408" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">Ethernet</text><path d="M 289 110 H 309 V 240 H 289 M 309 175 H 417 M 289 248 H 417 M 289 294 H 417 M 289 340 H 309 V 424 H 289 M 309 382 H 417" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="32" y="468" font-size="21" fill="#192d33" text-anchor="start" font-weight="400">계층 번호보다 기능을 기준으로 대응합니다.</text><text x="32" y="500" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">실제 프로토콜 구현은 모델과 경계가 다를 수 있습니다.</text></g></svg>
