<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">/26 주소 블록에서 내 서브넷 찾기</title><desc id="desc">192.168.10.77/26은 마지막 옥텟 64~127 블록에 속합니다. 네트워크 주소 .64, 브로드캐스트 .127, 일반 LAN에서 할당 가능한 호스트 주소는 .65~.126으로 62개입니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">/26 주소 블록에서 내 서브넷 찾기</text><text x="32" y="87" font-size="28" fill="#087a61" text-anchor="start" font-weight="700">192.168.10.77/26</text><text x="32" y="121" font-size="21" fill="#536b70" text-anchor="start" font-weight="400">마스크 255.255.255.192  ·  호스트 부분 6비트</text><text x="32" y="166" font-size="22" fill="#103b37" text-anchor="start" font-weight="600">192.168.10.0/24를 64개 주소씩 나누기</text><rect x="32" y="186" width="156" height="69" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="110" y="227" font-size="23" fill="#192d33" text-anchor="middle" font-weight="400">0~63</text><rect x="196" y="186" width="156" height="69" rx="8" fill="#087a61" stroke="#087a61" stroke-width="1.5"/><text x="274" y="227" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">64~127</text><rect x="360" y="186" width="156" height="69" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="438" y="227" font-size="23" fill="#192d33" text-anchor="middle" font-weight="400">128~191</text><rect x="524" y="186" width="156" height="69" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="602" y="227" font-size="23" fill="#192d33" text-anchor="middle" font-weight="400">192~255</text><text x="278" y="282" font-size="21" fill="#087a61" text-anchor="middle" font-weight="700">77이 속한 블록</text><line x1="278" y1="291" x2="278" y2="319" stroke="#087a61" stroke-width="2.5" /><path d="M 273.84398742012667 311.01704569498645 L 278 319 L 282.15601257987333 311.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><rect x="32" y="332" width="656" height="92" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><rect x="32" y="332" width="156" height="92" rx="8" fill="#edf1f3" stroke="#dce4df" stroke-width="1.5"/><rect x="532" y="332" width="156" height="92" rx="8" fill="#edf1f3" stroke="#dce4df" stroke-width="1.5"/><text x="110" y="368" font-size="26" fill="#103b37" text-anchor="middle" font-weight="700">.64</text><text x="110" y="402" font-size="20" fill="#192d33" text-anchor="middle" font-weight="400">네트워크</text><text x="360" y="368" font-size="26" fill="#087a61" text-anchor="middle" font-weight="700">.65 ~ .126</text><text x="360" y="402" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">호스트에 할당 가능: 62개</text><text x="610" y="368" font-size="26" fill="#103b37" text-anchor="middle" font-weight="700">.127</text><text x="610" y="402" font-size="20" fill="#192d33" text-anchor="middle" font-weight="400">브로드캐스트</text><text x="32" y="465" font-size="21" fill="#103b37" text-anchor="start" font-weight="600">전체 주소 64개 − 양 끝의 2개 = 호스트 주소 62개</text><text x="32" y="500" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">일반 LAN 예시 · /31·/32에는 같은 식을 적용하지 않음</text></g></svg>
