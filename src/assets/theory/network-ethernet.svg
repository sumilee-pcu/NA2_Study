<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Ethernet 프레임과 전이중 연결</title><desc id="desc">VLAN 태그 없는 Ethernet II 프레임은 목적지 MAC 6바이트, 출발지 MAC 6바이트, 유형 2바이트, 데이터와 패딩 46~1500바이트, FCS 4바이트입니다. 정상적인 전이중 링크에서는 동시 송수신하고 CSMA/CD를 사용하지 않습니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">Ethernet 프레임과 전이중 연결</text><text x="32" y="84" font-size="21" fill="#536b70" text-anchor="start" font-weight="400">Ethernet II · VLAN 태그가 없는 프레임</text><rect x="32" y="112" width="122" height="124" rx="0" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="93" y="145" font-size="21" fill="#192d33" text-anchor="middle" font-weight="600">목적지</text><text x="93" y="173" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">MAC</text><text x="93" y="214" font-size="21" fill="#087a61" text-anchor="middle" font-weight="700">6 B</text><rect x="154" y="112" width="122" height="124" rx="0" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="215" y="145" font-size="21" fill="#192d33" text-anchor="middle" font-weight="600">출발지</text><text x="215" y="173" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">MAC</text><text x="215" y="214" font-size="21" fill="#087a61" text-anchor="middle" font-weight="700">6 B</text><rect x="276" y="112" width="96" height="124" rx="0" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="324" y="145" font-size="21" fill="#192d33" text-anchor="middle" font-weight="600">유형</text><text x="324" y="214" font-size="21" fill="#087a61" text-anchor="middle" font-weight="700">2 B</text><rect x="372" y="112" width="220" height="124" rx="0" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="482" y="145" font-size="21" fill="#192d33" text-anchor="middle" font-weight="600">데이터·패딩</text><text x="482" y="214" font-size="21" fill="#087a61" text-anchor="middle" font-weight="700">46~1500 B</text><rect x="592" y="112" width="96" height="124" rx="0" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="640" y="145" font-size="21" fill="#192d33" text-anchor="middle" font-weight="600">FCS</text><text x="640" y="214" font-size="21" fill="#087a61" text-anchor="middle" font-weight="700">4 B</text><text x="32" y="271" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">프리앰블·SFD 제외 · 그림 너비는 실제 크기와 다름</text><text x="32" y="322" font-size="23" fill="#103b37" text-anchor="start" font-weight="700">전이중: 양쪽이 동시에 송신·수신</text><rect x="48" y="352" width="140" height="88" rx="8" fill="#103b37" stroke="#103b37" stroke-width="1.5"/><text x="118" y="405" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">장치 A</text><rect x="532" y="352" width="140" height="88" rx="8" fill="#103b37" stroke="#103b37" stroke-width="1.5"/><text x="602" y="405" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">장치 B</text><line x1="202" y1="376" x2="516" y2="376" stroke="#087a61" stroke-width="2.5" /><path d="M 508.01704569498645 380.15601257987333 L 516 376 L 508.01704569498645 371.84398742012667" fill="none" stroke="#087a61" stroke-width="2.5"/><line x1="516" y1="418" x2="202" y2="418" stroke="#087a61" stroke-width="2.5" /><path d="M 209.98295430501355 413.84398742012667 L 202 418 L 209.98295430501355 422.15601257987333" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="360" y="365" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">A → B</text><text x="360" y="449" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">B → A</text><text x="360" y="492" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">정상적인 지점 간 전이중 링크는 CSMA/CD 미사용</text></g></svg>
