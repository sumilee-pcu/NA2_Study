<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">access 포트와 trunk 링크의 역할</title><desc id="desc">각 스위치의 access 포트에 VLAN 10과 VLAN 20 단말이 연결됩니다. 두 스위치 사이 하나의 trunk 링크는 허용한 VLAN 10과 20 트래픽을 전달합니다. 선 종류는 VLAN 구분이며 실제 케이블은 하나입니다. 서로 다른 VLAN 사이 통신에는 라우팅 기능이 필요합니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">access 포트와 trunk 링크의 역할</text><text x="32" y="87" font-size="21" fill="#536b70" text-anchor="start" font-weight="400">VLAN 10과 VLAN 20을 두 스위치에 구성한 예</text><rect x="32" y="122" width="144" height="65" rx="8" fill="#e7f3ec" stroke="#087a61" stroke-width="1.5"/><text x="104" y="162" font-size="23" fill="#087a61" text-anchor="middle" font-weight="700">VLAN 10</text><rect x="544" y="122" width="144" height="65" rx="8" fill="#e7f3ec" stroke="#087a61" stroke-width="1.5"/><text x="616" y="162" font-size="23" fill="#087a61" text-anchor="middle" font-weight="700">VLAN 10</text><rect x="32" y="356" width="144" height="65" rx="8" fill="#eaf2f8" stroke="#286387" stroke-width="1.5"/><text x="104" y="396" font-size="23" fill="#286387" text-anchor="middle" font-weight="700">VLAN 20</text><rect x="544" y="356" width="144" height="65" rx="8" fill="#eaf2f8" stroke="#286387" stroke-width="1.5"/><text x="616" y="396" font-size="23" fill="#286387" text-anchor="middle" font-weight="700">VLAN 20</text><rect x="32" y="237" width="144" height="67" rx="8" fill="#103b37" stroke="#103b37" stroke-width="1.5"/><text x="104" y="277" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">스위치 1</text><rect x="544" y="237" width="144" height="67" rx="8" fill="#103b37" stroke="#103b37" stroke-width="1.5"/><text x="616" y="277" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">스위치 2</text><line x1="104" y1="187" x2="104" y2="237" stroke="#087a61" stroke-width="2.5" /><line x1="616" y1="187" x2="616" y2="237" stroke="#087a61" stroke-width="2.5" /><line x1="104" y1="304" x2="104" y2="356" stroke="#286387" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="616" y1="304" x2="616" y2="356" stroke="#286387" stroke-width="2.5" stroke-dasharray="5 4"/><text x="120" y="218" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">access</text><text x="632" y="218" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">access</text><text x="120" y="339" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">access</text><text x="632" y="339" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">access</text><line x1="176" y1="259" x2="544" y2="259" stroke="#087a61" stroke-width="2.5" /><line x1="176" y1="284" x2="544" y2="284" stroke="#286387" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="246" y="185" width="228" height="49" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="360" y="217" font-size="23" fill="#103b37" text-anchor="middle" font-weight="700">trunk · 802.1Q</text><text x="360" y="325" font-size="21" fill="#103b37" text-anchor="middle" font-weight="400">허용 VLAN 10·20 전달</text><text x="360" y="360" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">실선: 10 / 점선: 20</text><text x="32" y="466" font-size="21" fill="#103b37" text-anchor="start" font-weight="600">서로 다른 VLAN 사이의 IP 통신에는 라우팅이 필요합니다.</text><text x="32" y="499" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">네이티브 VLAN·허용 목록·태그 처리는 장비 설정을 확인합니다.</text><text x="360" y="391" font-size="20" fill="#536b70" text-anchor="middle">하나의 링크에 두 VLAN</text></g></svg>
