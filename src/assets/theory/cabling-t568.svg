<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">T568A와 T568B의 핀 배열</title><desc id="desc">T568A: 흰초 초 흰주 파 흰파 주 흰갈 갈. T568B: 흰주 주 흰초 파 흰파 초 흰갈 갈. 두 배열에서 주황 쌍과 초록 쌍이 바뀐다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087a61" stroke-width="1.5"/></marker><pattern id="wo" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#f97316"/></pattern><pattern id="wg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#16a34a"/></pattern><pattern id="wb" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#2563eb"/></pattern><pattern id="wbr" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#92400e"/></pattern></defs><rect width="760" height="520" rx="12" fill="#fff"/><g font-family="Malgun Gothic,system-ui,sans-serif" fill="#192d33"><text x="28" y="40" font-size="27" font-weight="700">T568A와 T568B의 핀 배열</text><text x="28" y="76" font-size="21" >접점 면이 앞 · 클립은 뒤 · 케이블은 아래</text><text x="28" y="180" font-size="23" font-weight="700">T568A</text><g data-standard="T568A" data-pin="1" data-wire="wg"><title>1번 흰색/초록 줄무늬</title><text x="181" y="117" font-size="22" text-anchor="middle">1</text><rect x="165" y="129" width="32" height="84" rx="4" fill="url(#wg)" stroke="#687779"/><rect x="165" y="129" width="32" height="10" fill="#c99127"/><text x="181" y="242" font-size="21" text-anchor="middle" font-weight="700">흰초</text></g><g data-standard="T568A" data-pin="2" data-wire="g"><title>2번 초록 단색</title><text x="251" y="117" font-size="22" text-anchor="middle">2</text><rect x="235" y="129" width="32" height="84" rx="4" fill="#16a34a" stroke="#687779"/><rect x="235" y="129" width="32" height="10" fill="#c99127"/><text x="251" y="242" font-size="21" text-anchor="middle" font-weight="700">초</text></g><g data-standard="T568A" data-pin="3" data-wire="wo"><title>3번 흰색/주황 줄무늬</title><text x="321" y="117" font-size="22" text-anchor="middle">3</text><rect x="305" y="129" width="32" height="84" rx="4" fill="url(#wo)" stroke="#687779"/><rect x="305" y="129" width="32" height="10" fill="#c99127"/><text x="321" y="242" font-size="21" text-anchor="middle" font-weight="700">흰주</text></g><g data-standard="T568A" data-pin="4" data-wire="b"><title>4번 파랑 단색</title><text x="391" y="117" font-size="22" text-anchor="middle">4</text><rect x="375" y="129" width="32" height="84" rx="4" fill="#2563eb" stroke="#687779"/><rect x="375" y="129" width="32" height="10" fill="#c99127"/><text x="391" y="242" font-size="21" text-anchor="middle" font-weight="700">파</text></g><g data-standard="T568A" data-pin="5" data-wire="wb"><title>5번 흰색/파랑 줄무늬</title><text x="461" y="117" font-size="22" text-anchor="middle">5</text><rect x="445" y="129" width="32" height="84" rx="4" fill="url(#wb)" stroke="#687779"/><rect x="445" y="129" width="32" height="10" fill="#c99127"/><text x="461" y="242" font-size="21" text-anchor="middle" font-weight="700">흰파</text></g><g data-standard="T568A" data-pin="6" data-wire="o"><title>6번 주황 단색</title><text x="531" y="117" font-size="22" text-anchor="middle">6</text><rect x="515" y="129" width="32" height="84" rx="4" fill="#f97316" stroke="#687779"/><rect x="515" y="129" width="32" height="10" fill="#c99127"/><text x="531" y="242" font-size="21" text-anchor="middle" font-weight="700">주</text></g><g data-standard="T568A" data-pin="7" data-wire="wbr"><title>7번 흰색/갈색 줄무늬</title><text x="601" y="117" font-size="22" text-anchor="middle">7</text><rect x="585" y="129" width="32" height="84" rx="4" fill="url(#wbr)" stroke="#687779"/><rect x="585" y="129" width="32" height="10" fill="#c99127"/><text x="601" y="242" font-size="21" text-anchor="middle" font-weight="700">흰갈</text></g><g data-standard="T568A" data-pin="8" data-wire="br"><title>8번 갈색 단색</title><text x="671" y="117" font-size="22" text-anchor="middle">8</text><rect x="655" y="129" width="32" height="84" rx="4" fill="#92400e" stroke="#687779"/><rect x="655" y="129" width="32" height="10" fill="#c99127"/><text x="671" y="242" font-size="21" text-anchor="middle" font-weight="700">갈</text></g><text x="28" y="357" font-size="23" font-weight="700">T568B</text><g data-standard="T568B" data-pin="1" data-wire="wo"><title>1번 흰색/주황 줄무늬</title><text x="181" y="294" font-size="22" text-anchor="middle">1</text><rect x="165" y="306" width="32" height="84" rx="4" fill="url(#wo)" stroke="#687779"/><rect x="165" y="306" width="32" height="10" fill="#c99127"/><text x="181" y="419" font-size="21" text-anchor="middle" font-weight="700">흰주</text></g><g data-standard="T568B" data-pin="2" data-wire="o"><title>2번 주황 단색</title><text x="251" y="294" font-size="22" text-anchor="middle">2</text><rect x="235" y="306" width="32" height="84" rx="4" fill="#f97316" stroke="#687779"/><rect x="235" y="306" width="32" height="10" fill="#c99127"/><text x="251" y="419" font-size="21" text-anchor="middle" font-weight="700">주</text></g><g data-standard="T568B" data-pin="3" data-wire="wg"><title>3번 흰색/초록 줄무늬</title><text x="321" y="294" font-size="22" text-anchor="middle">3</text><rect x="305" y="306" width="32" height="84" rx="4" fill="url(#wg)" stroke="#687779"/><rect x="305" y="306" width="32" height="10" fill="#c99127"/><text x="321" y="419" font-size="21" text-anchor="middle" font-weight="700">흰초</text></g><g data-standard="T568B" data-pin="4" data-wire="b"><title>4번 파랑 단색</title><text x="391" y="294" font-size="22" text-anchor="middle">4</text><rect x="375" y="306" width="32" height="84" rx="4" fill="#2563eb" stroke="#687779"/><rect x="375" y="306" width="32" height="10" fill="#c99127"/><text x="391" y="419" font-size="21" text-anchor="middle" font-weight="700">파</text></g><g data-standard="T568B" data-pin="5" data-wire="wb"><title>5번 흰색/파랑 줄무늬</title><text x="461" y="294" font-size="22" text-anchor="middle">5</text><rect x="445" y="306" width="32" height="84" rx="4" fill="url(#wb)" stroke="#687779"/><rect x="445" y="306" width="32" height="10" fill="#c99127"/><text x="461" y="419" font-size="21" text-anchor="middle" font-weight="700">흰파</text></g><g data-standard="T568B" data-pin="6" data-wire="g"><title>6번 초록 단색</title><text x="531" y="294" font-size="22" text-anchor="middle">6</text><rect x="515" y="306" width="32" height="84" rx="4" fill="#16a34a" stroke="#687779"/><rect x="515" y="306" width="32" height="10" fill="#c99127"/><text x="531" y="419" font-size="21" text-anchor="middle" font-weight="700">초</text></g><g data-standard="T568B" data-pin="7" data-wire="wbr"><title>7번 흰색/갈색 줄무늬</title><text x="601" y="294" font-size="22" text-anchor="middle">7</text><rect x="585" y="306" width="32" height="84" rx="4" fill="url(#wbr)" stroke="#687779"/><rect x="585" y="306" width="32" height="10" fill="#c99127"/><text x="601" y="419" font-size="21" text-anchor="middle" font-weight="700">흰갈</text></g><g data-standard="T568B" data-pin="8" data-wire="br"><title>8번 갈색 단색</title><text x="671" y="294" font-size="22" text-anchor="middle">8</text><rect x="655" y="306" width="32" height="84" rx="4" fill="#92400e" stroke="#687779"/><rect x="655" y="306" width="32" height="10" fill="#c99127"/><text x="671" y="419" font-size="21" text-anchor="middle" font-weight="700">갈</text></g><rect x="28" y="450" width="704" height="49" rx="8" fill="#edf6f2"/><text x="43" y="481" font-size="21" >변경: 주황·초록 쌍     공통: 파랑 4·5번 / 갈색 7·8번</text></g></svg>
