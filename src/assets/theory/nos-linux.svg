<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Linux 권한 640을 세 묶음으로 읽기</title><desc id="desc">일반 파일의 640은 소유자 rw-로 읽기와 쓰기 4+2=6, 그룹 r--로 읽기 4, 그 밖의 사용자는 ---로 0입니다. 디렉터리의 실행 비트는 경로 탐색 권한을 뜻합니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">Linux 권한 640을 세 묶음으로 읽기</text><text x="32" y="89" font-size="27" fill="#087a61" text-anchor="start" font-weight="700">chmod 640 sample</text><text x="32" y="127" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">일반 파일의 권한을 소유자·그룹·그 밖의 사용자로 구분</text><rect x="32" y="157" width="208" height="244" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="136" y="191" font-size="20" fill="#103b37" text-anchor="middle" font-weight="700">소유자 u</text><text x="136" y="241" font-size="38" fill="#087a61" text-anchor="middle" font-weight="700">rw-</text><text x="136" y="280" font-size="22" fill="#536b70" text-anchor="middle" font-weight="400">4 + 2 + 0</text><line x1="136" y1="292" x2="136" y2="315" stroke="#087a61" stroke-width="2.5" /><path d="M 131.84398742012667 307.01704569498645 L 136 315 L 140.15601257987333 307.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="136" y="354" font-size="36" fill="#087a61" text-anchor="middle" font-weight="700">6</text><text x="136" y="383" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">읽기·쓰기</text><rect x="256" y="157" width="208" height="244" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="360" y="191" font-size="20" fill="#103b37" text-anchor="middle" font-weight="700">그룹 g</text><text x="360" y="241" font-size="38" fill="#087a61" text-anchor="middle" font-weight="700">r--</text><text x="360" y="280" font-size="22" fill="#536b70" text-anchor="middle" font-weight="400">4 + 0 + 0</text><line x1="360" y1="292" x2="360" y2="315" stroke="#087a61" stroke-width="2.5" /><path d="M 355.84398742012667 307.01704569498645 L 360 315 L 364.15601257987333 307.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="360" y="354" font-size="36" fill="#087a61" text-anchor="middle" font-weight="700">4</text><text x="360" y="383" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">읽기</text><rect x="480" y="157" width="208" height="244" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="584" y="191" font-size="20" fill="#103b37" text-anchor="middle" font-weight="700">그 밖의 사용자 o</text><text x="584" y="241" font-size="38" fill="#087a61" text-anchor="middle" font-weight="700">---</text><text x="584" y="280" font-size="22" fill="#536b70" text-anchor="middle" font-weight="400">0 + 0 + 0</text><line x1="584" y1="292" x2="584" y2="315" stroke="#087a61" stroke-width="2.5" /><path d="M 579.8439874201266 307.01704569498645 L 584 315 L 588.1560125798734 307.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="584" y="354" font-size="36" fill="#087a61" text-anchor="middle" font-weight="700">0</text><text x="584" y="383" font-size="21" fill="#192d33" text-anchor="middle" font-weight="400">권한 없음</text><text x="32" y="444" font-size="22" fill="#103b37" text-anchor="start" font-weight="600">r = 4 (읽기)     w = 2 (쓰기)     x = 1 (실행)</text><text x="32" y="480" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">권한 자리의 - 는 권한 없음 · 디렉터리의 x는 경로 탐색</text><text x="436" y="89" font-size="27" fill="#103b37" font-family="Consolas, monospace" font-weight="600">-rw-r-----</text></g></svg>
