<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">접점 면을 보고 1번부터 읽기</title><desc id="desc">금속 접점 면이 앞, 클립은 뒤, 케이블은 아래인 관찰 기준. 접점 번호는 왼쪽부터 1에서 8이다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087a61" stroke-width="1.5"/></marker><pattern id="wo" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#f97316"/></pattern><pattern id="wg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#16a34a"/></pattern><pattern id="wb" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#2563eb"/></pattern><pattern id="wbr" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#92400e"/></pattern></defs><rect width="760" height="520" rx="12" fill="#fff"/><g font-family="Malgun Gothic,system-ui,sans-serif" fill="#192d33"><text x="28" y="40" font-size="27" font-weight="700">접점 면을 보고 1번부터 읽기</text><text x="28" y="76" font-size="21" >8P8C 플러그 · 일반적으로 RJ-45라고 부르는 형태</text><rect x="96" y="144" width="300" height="230" rx="18" fill="#edf6f2" stroke="#103b37" stroke-width="3"/><path d="M122 374V400H370V374" fill="#edf6f2" stroke="#103b37" stroke-width="3"/><path d="M214 400V472H278V400" fill="#dce4df" stroke="#103b37" stroke-width="3"/><path d="M220 205H272V338L260 361H232L220 338Z" fill="none" stroke="#687779" stroke-width="2" stroke-dasharray="7 5"/><g data-pin="1"><text x="126" y="129" font-size="23" text-anchor="middle" font-weight="700">1</text><rect x="115" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M126 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="2"><text x="160" y="129" font-size="23" text-anchor="middle" font-weight="700">2</text><rect x="149" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M160 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="3"><text x="194" y="129" font-size="23" text-anchor="middle" font-weight="700">3</text><rect x="183" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M194 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="4"><text x="228" y="129" font-size="23" text-anchor="middle" font-weight="700">4</text><rect x="217" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M228 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="5"><text x="262" y="129" font-size="23" text-anchor="middle" font-weight="700">5</text><rect x="251" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M262 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="6"><text x="296" y="129" font-size="23" text-anchor="middle" font-weight="700">6</text><rect x="285" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M296 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="7"><text x="330" y="129" font-size="23" text-anchor="middle" font-weight="700">7</text><rect x="319" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M330 219V329" stroke="#b4c8be" stroke-width="4"/></g><g data-pin="8"><text x="364" y="129" font-size="23" text-anchor="middle" font-weight="700">8</text><rect x="353" y="149" width="22" height="65" rx="3" fill="#c99127" stroke="#785615"/><path d="M364 219V329" stroke="#b4c8be" stroke-width="4"/></g><path d="M133 97H376" fill="none" stroke="#087a61" stroke-width="2" marker-end="url(#arrow)"/><path d="M396 177H440" stroke="#087a61" stroke-width="2"/><path d="M272 289H440" stroke="#687779" stroke-width="2" stroke-dasharray="6 5"/><path d="M278 438H440" stroke="#087a61" stroke-width="2"/><text x="458" y="170" font-size="22" font-weight="700">금속 접점이 보이는 면</text><text x="458" y="201" font-size="20" >접점이 있는 끝은 위쪽</text><text x="458" y="284" font-size="22" font-weight="700">고정 클립은 뒷면</text><text x="458" y="316" font-size="20" >점선 = 반대쪽의 위치</text><text x="458" y="435" font-size="22" font-weight="700">케이블은 아래쪽</text><text x="28" y="505" font-size="20" >관찰 방향을 바꾸면 화면의 좌우만으로 핀 번호를 판단하지 않습니다.</text></g></svg>
