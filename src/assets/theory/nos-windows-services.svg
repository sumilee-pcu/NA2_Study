<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">DHCP와 DNS의 요청·응답 구분</title><desc id="desc">DHCP 신규 임대의 대표 절차는 Discover, Offer, Request, ACK입니다. DNS는 이름을 질의하고 자원 레코드를 응답하며, 예시에서는 server.example의 A 레코드 주소 192.168.10.20을 반환합니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">DHCP와 DNS의 요청·응답 구분</text><text x="177" y="88" font-size="23" fill="#087a61" text-anchor="middle" font-weight="700">DHCP · IP 구성 임대</text><text x="543" y="88" font-size="23" fill="#103b37" text-anchor="middle" font-weight="700">DNS · 이름 조회</text><line x1="360" y1="71" x2="360" y2="458" stroke="#dce4df" stroke-width="2.5" /><text x="60" y="128" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">클라이언트</text><line x1="54" y1="145" x2="54" y2="400" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><text x="302" y="128" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">서버</text><line x1="302" y1="145" x2="302" y2="400" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><text x="425" y="128" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">클라이언트</text><line x1="425" y1="145" x2="425" y2="400" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><text x="666" y="128" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">서버</text><line x1="666" y1="145" x2="666" y2="400" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><text x="178" y="165" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">1 Discover</text><line x1="54" y1="176" x2="302" y2="186" stroke="#087a61" stroke-width="2.5" /><path d="M 293.8560824941477 189.83100608951128 L 302 186 L 294.19097265883096 181.5257300053669" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="178" y="227" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">2 Offer</text><line x1="302" y1="238" x2="54" y2="248" stroke="#087a61" stroke-width="2.5" /><path d="M 61.809027341169056 243.5257300053669 L 54 248 L 62.1439175058523 251.83100608951128" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="178" y="289" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">3 Request</text><line x1="54" y1="300" x2="302" y2="310" stroke="#087a61" stroke-width="2.5" /><path d="M 293.8560824941477 313.8310060895113 L 302 310 L 294.19097265883096 305.5257300053669" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="178" y="351" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">4 ACK</text><line x1="302" y1="362" x2="54" y2="372" stroke="#087a61" stroke-width="2.5" /><path d="M 61.809027341169056 367.5257300053669 L 54 372 L 62.1439175058523 375.8310060895113" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="545" y="176" font-size="20" fill="#103b37" text-anchor="middle" font-weight="400">server.example?</text><line x1="425" y1="191" x2="666" y2="201" stroke="#103b37" stroke-width="2.5" /><path d="M 657.8516087023593 204.82148129140162 L 666 201 L 658.196209484128 196.51660245077628" fill="none" stroke="#103b37" stroke-width="2.5"/><text x="545" y="263" font-size="21" fill="#103b37" text-anchor="middle" font-weight="600">192.168.10.20</text><line x1="666" y1="280" x2="425" y2="290" stroke="#103b37" stroke-width="2.5" /><path d="M 432.80379051587204 285.5166024507763 L 425 290 L 433.1483912976407 293.8214812914016" fill="none" stroke="#103b37" stroke-width="2.5"/><text x="545" y="335" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">A 레코드 응답 예</text><text x="177" y="433" font-size="20" fill="#087a61" text-anchor="middle" font-weight="400">IP·마스크·게이트웨이 등</text><text x="543" y="433" font-size="20" fill="#103b37" text-anchor="middle" font-weight="400">이름에 해당하는 주소 확인</text><text x="32" y="485" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">주소를 받는 과정과 이름을 조회하는 과정은 서로 다른 기능입니다.</text></g></svg>
