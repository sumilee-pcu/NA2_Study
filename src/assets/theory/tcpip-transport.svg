<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">TCP와 UDP의 전송 절차 비교</title><desc id="desc">TCP의 일반적인 연결 설정은 SYN, SYN+ACK, ACK 순서입니다. UDP는 데이터그램을 전송하며 중간 데이터가 손실되어도 UDP 자체에 재전송 절차가 없습니다. 시간은 아래로 진행합니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">TCP와 UDP의 전송 절차 비교</text><text x="177" y="87" font-size="24" fill="#087a61" text-anchor="middle" font-weight="700">TCP · 연결 설정</text><text x="543" y="87" font-size="24" fill="#103b37" text-anchor="middle" font-weight="700">UDP · 데이터그램</text><line x1="360" y1="72" x2="360" y2="462" stroke="#dce4df" stroke-width="2.5" /><rect x="39" y="105" width="52" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="65" y="132" font-size="22" fill="#192d33" text-anchor="middle" font-weight="700">A</text><line x1="65" y1="146" x2="65" y2="392" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="264" y="105" width="52" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="290" y="132" font-size="22" fill="#192d33" text-anchor="middle" font-weight="700">B</text><line x1="290" y1="146" x2="290" y2="392" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="404" y="105" width="52" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="430" y="132" font-size="22" fill="#192d33" text-anchor="middle" font-weight="700">A</text><line x1="430" y1="146" x2="430" y2="392" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><rect x="629" y="105" width="52" height="38" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="655" y="132" font-size="22" fill="#192d33" text-anchor="middle" font-weight="700">B</text><line x1="655" y1="146" x2="655" y2="392" stroke="#dce4df" stroke-width="2.5" stroke-dasharray="5 6"/><line x1="65" y1="188" x2="290" y2="204" stroke="#087a61" stroke-width="2.5" /><path d="M 281.7423592725558 207.57929736351355 L 290 204 L 282.3319477843726 199.28820891609027" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="177" y="174" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">1  SYN</text><line x1="290" y1="263" x2="65" y2="279" stroke="#087a61" stroke-width="2.5" /><path d="M 72.66805221562743 274.28820891609024 L 65 279 L 73.2576407274442 282.57929736351355" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="177" y="251" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">2  SYN + ACK</text><line x1="65" y1="338" x2="290" y2="354" stroke="#087a61" stroke-width="2.5" /><path d="M 281.7423592725558 357.57929736351355 L 290 354 L 282.3319477843726 349.28820891609024" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="177" y="326" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">3  ACK</text><line x1="430" y1="188" x2="655" y2="204" stroke="#087a61" stroke-width="2.5" /><path d="M 646.7423592725559 207.57929736351355 L 655 204 L 647.3319477843726 199.28820891609027" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="543" y="174" font-size="21" fill="#103b37" text-anchor="middle" font-weight="400">데이터그램 1</text><line x1="430" y1="263" x2="545" y2="271" stroke="#536b70" stroke-width="2.5" /><path d="M 536.7478750121487 274.5919957105877 L 545 271 L 537.3247087924126 266.3000101192948" fill="none" stroke="#536b70" stroke-width="2.5"/><text x="543" y="251" font-size="21" fill="#103b37" text-anchor="middle" font-weight="400">데이터그램 2</text><line x1="555" y1="261" x2="573" y2="279" stroke="#536b70" stroke-width="2.5" /><line x1="555" y1="279" x2="573" y2="261" stroke="#536b70" stroke-width="2.5" /><text x="606" y="291" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">손실 예</text><line x1="430" y1="338" x2="655" y2="354" stroke="#087a61" stroke-width="2.5" /><path d="M 646.7423592725559 357.57929736351355 L 655 354 L 647.3319477843726 349.28820891609024" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="543" y="326" font-size="21" fill="#103b37" text-anchor="middle" font-weight="400">데이터그램 3</text><text x="177" y="427" font-size="21" fill="#087a61" text-anchor="middle" font-weight="600">순서·확인 응답·재전송</text><text x="543" y="427" font-size="21" fill="#103b37" text-anchor="middle" font-weight="600">UDP 자체의 재전송 없음</text><text x="32" y="482" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">UDP는 도착·순서를 보장하지 않으며, 추가 처리는 응용에서 구현합니다.</text></g></svg>
