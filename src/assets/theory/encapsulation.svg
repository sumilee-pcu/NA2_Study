<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">데이터에 전송 정보가 붙는 순서</title><desc id="desc">응용 데이터 앞에 TCP 헤더, IP 헤더, Ethernet 헤더가 차례로 붙고 Ethernet 끝에 FCS가 붙습니다. 필드 크기는 실제 바이트 수에 비례하지 않습니다.</desc><rect width="720" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="32" y="45" font-size="27" fill="#103b37" text-anchor="start" font-weight="700">데이터에 전송 정보가 붙는 순서</text><text x="32" y="84" font-size="21" fill="#536b70" text-anchor="start" font-weight="400">TCP 데이터를 Ethernet으로 전송하는 예</text><text x="32" y="124" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">응용</text><rect x="370" y="104" width="268" height="54" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="504" y="128" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">데이터</text><line x1="351" y1="128" x2="351" y2="182" stroke="#087a61" stroke-width="2.5" /><path d="M 346.84398742012667 174.01704569498645 L 351 182 L 355.15601257987333 174.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="32" y="208" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">TCP</text><rect x="278" y="188" width="92" height="54" rx="8" fill="#d4eadd" stroke="#dce4df" stroke-width="1.5"/><text x="324" y="212" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">TCP</text><text x="324" y="234" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">헤더</text><rect x="370" y="188" width="268" height="54" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="504" y="212" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">데이터</text><line x1="259" y1="212" x2="259" y2="266" stroke="#087a61" stroke-width="2.5" /><path d="M 254.84398742012667 258.01704569498645 L 259 266 L 263.15601257987333 258.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="32" y="292" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">IP</text><rect x="186" y="272" width="92" height="54" rx="8" fill="#baddca" stroke="#dce4df" stroke-width="1.5"/><text x="232" y="296" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">IP</text><text x="232" y="318" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">헤더</text><rect x="278" y="272" width="92" height="54" rx="8" fill="#d4eadd" stroke="#dce4df" stroke-width="1.5"/><text x="324" y="296" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">TCP</text><text x="324" y="318" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">헤더</text><rect x="370" y="272" width="268" height="54" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="504" y="296" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">데이터</text><line x1="167" y1="296" x2="167" y2="350" stroke="#087a61" stroke-width="2.5" /><path d="M 162.84398742012667 342.01704569498645 L 167 350 L 171.15601257987333 342.01704569498645" fill="none" stroke="#087a61" stroke-width="2.5"/><text x="32" y="376" font-size="20" fill="#536b70" text-anchor="start" font-weight="400">링크</text><rect x="86" y="356" width="100" height="54" rx="8" fill="#a2ceb9" stroke="#dce4df" stroke-width="1.5"/><text x="136" y="380" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">Ethernet</text><text x="136" y="402" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">헤더</text><rect x="186" y="356" width="92" height="54" rx="8" fill="#baddca" stroke="#dce4df" stroke-width="1.5"/><text x="232" y="380" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">IP</text><text x="232" y="402" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">헤더</text><rect x="278" y="356" width="92" height="54" rx="8" fill="#d4eadd" stroke="#dce4df" stroke-width="1.5"/><text x="324" y="380" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">TCP</text><text x="324" y="402" font-size="20" fill="#536b70" text-anchor="middle" font-weight="400">헤더</text><rect x="370" y="356" width="268" height="54" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="504" y="380" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">데이터</text><rect x="638" y="356" width="56" height="54" rx="8" fill="#d8e6ec" stroke="#dce4df" stroke-width="1.5"/><text x="666" y="380" font-size="20" fill="#192d33" text-anchor="middle" font-weight="600">FCS</text><text x="32" y="455" font-size="22" fill="#103b37" text-anchor="start" font-weight="600">송신: 헤더·검사 정보 추가 → 캡슐화</text><text x="32" y="490" font-size="22" fill="#103b37" text-anchor="start" font-weight="600">수신: 해당 계층의 정보 해석 → 역캡슐화</text></g></svg>
