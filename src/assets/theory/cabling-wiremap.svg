<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">직결과 두 쌍 교차의 연결 관계</title><desc id="desc">직결은 같은 핀끼리 연결한다. T568A와 T568B의 두 쌍 교차는 1-3, 2-6, 3-1, 6-2이며 4,5,7,8번은 같은 핀끼리 연결한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087a61" stroke-width="1.5"/></marker><pattern id="wo" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#f97316"/></pattern><pattern id="wg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#16a34a"/></pattern><pattern id="wb" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#2563eb"/></pattern><pattern id="wbr" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="white"/><rect width="5" height="12" fill="#92400e"/></pattern></defs><rect width="760" height="560" rx="12" fill="#fff"/><g font-family="Malgun Gothic,system-ui,sans-serif" fill="#192d33"><text x="28" y="40" font-size="27" font-weight="700">직결과 두 쌍 교차의 연결 관계</text><text x="28" y="78" font-size="20" >선의 교차점은 접속점이 아닙니다. 양 끝의 번호를 따라갑니다.</text><rect x="24" y="102" width="342" height="343" rx="10" fill="#f3f7f4" stroke="#dce4df"/><text x="42" y="137" font-size="22" font-weight="700">직결 · A–A 또는 B–B</text><text x="65" y="172" font-size="18" >끝 1</text><text x="279" y="172" font-size="18" >끝 2</text><g data-map="straight" data-from="1" data-to="1"><path d="M102 199L275 199" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="206" font-size="21" text-anchor="middle">1</text><text x="299" y="206" font-size="21" text-anchor="middle">1</text></g><g data-map="straight" data-from="2" data-to="2"><path d="M102 230L275 230" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="237" font-size="21" text-anchor="middle">2</text><text x="299" y="237" font-size="21" text-anchor="middle">2</text></g><g data-map="straight" data-from="3" data-to="3"><path d="M102 261L275 261" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="268" font-size="21" text-anchor="middle">3</text><text x="299" y="268" font-size="21" text-anchor="middle">3</text></g><g data-map="straight" data-from="4" data-to="4"><path d="M102 292L275 292" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="299" font-size="21" text-anchor="middle">4</text><text x="299" y="299" font-size="21" text-anchor="middle">4</text></g><g data-map="straight" data-from="5" data-to="5"><path d="M102 323L275 323" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="330" font-size="21" text-anchor="middle">5</text><text x="299" y="330" font-size="21" text-anchor="middle">5</text></g><g data-map="straight" data-from="6" data-to="6"><path d="M102 354L275 354" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="361" font-size="21" text-anchor="middle">6</text><text x="299" y="361" font-size="21" text-anchor="middle">6</text></g><g data-map="straight" data-from="7" data-to="7"><path d="M102 385L275 385" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="392" font-size="21" text-anchor="middle">7</text><text x="299" y="392" font-size="21" text-anchor="middle">7</text></g><g data-map="straight" data-from="8" data-to="8"><path d="M102 416L275 416" fill="none" stroke="#687779" stroke-width="2" /><text x="77" y="423" font-size="21" text-anchor="middle">8</text><text x="299" y="423" font-size="21" text-anchor="middle">8</text></g><rect x="394" y="102" width="342" height="343" rx="10" fill="#f3f7f4" stroke="#dce4df"/><text x="412" y="137" font-size="22" font-weight="700">두 쌍 교차 · A–B</text><text x="435" y="172" font-size="18" >끝 1</text><text x="649" y="172" font-size="18" >끝 2</text><g data-map="crossover" data-from="1" data-to="3"><path d="M472 199L645 261" fill="none" stroke="#087a61" stroke-width="3" /><text x="447" y="206" font-size="21" text-anchor="middle">1</text><text x="669" y="206" font-size="21" text-anchor="middle">1</text></g><g data-map="crossover" data-from="2" data-to="6"><path d="M472 230L645 354" fill="none" stroke="#a75a16" stroke-width="3" /><text x="447" y="237" font-size="21" text-anchor="middle">2</text><text x="669" y="237" font-size="21" text-anchor="middle">2</text></g><g data-map="crossover" data-from="3" data-to="1"><path d="M472 261L645 199" fill="none" stroke="#087a61" stroke-width="3" /><text x="447" y="268" font-size="21" text-anchor="middle">3</text><text x="669" y="268" font-size="21" text-anchor="middle">3</text></g><g data-map="crossover" data-from="4" data-to="4"><path d="M472 292L645 292" fill="none" stroke="#687779" stroke-width="2" stroke-dasharray="5 5"/><text x="447" y="299" font-size="21" text-anchor="middle">4</text><text x="669" y="299" font-size="21" text-anchor="middle">4</text></g><g data-map="crossover" data-from="5" data-to="5"><path d="M472 323L645 323" fill="none" stroke="#687779" stroke-width="2" stroke-dasharray="5 5"/><text x="447" y="330" font-size="21" text-anchor="middle">5</text><text x="669" y="330" font-size="21" text-anchor="middle">5</text></g><g data-map="crossover" data-from="6" data-to="2"><path d="M472 354L645 230" fill="none" stroke="#a75a16" stroke-width="3" /><text x="447" y="361" font-size="21" text-anchor="middle">6</text><text x="669" y="361" font-size="21" text-anchor="middle">6</text></g><g data-map="crossover" data-from="7" data-to="7"><path d="M472 385L645 385" fill="none" stroke="#687779" stroke-width="2" stroke-dasharray="5 5"/><text x="447" y="392" font-size="21" text-anchor="middle">7</text><text x="669" y="392" font-size="21" text-anchor="middle">7</text></g><g data-map="crossover" data-from="8" data-to="8"><path d="M472 416L645 416" fill="none" stroke="#687779" stroke-width="2" stroke-dasharray="5 5"/><text x="447" y="423" font-size="21" text-anchor="middle">8</text><text x="669" y="423" font-size="21" text-anchor="middle">8</text></g><text x="28" y="482" font-size="21" font-weight="700">두 쌍 교차: 1 ↔ 3, 2 ↔ 6  /  10BASE-T·100BASE-TX 기준</text><text x="28" y="515" font-size="19" >1000BASE-T는 네 쌍을 사용합니다. 포트의 Auto-MDI-X 지원도 확인합니다.</text><text x="28" y="545" font-size="19" >배열 확인 후에는 시험기로 단선·접촉·압착 상태를 별도로 점검합니다.</text></g></svg>
