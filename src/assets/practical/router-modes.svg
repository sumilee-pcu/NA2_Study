<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">라우터 모드 이동과 설정 저장</title><desc id="desc">사용자 EXEC에서 enable로 특권 EXEC, configure terminal로 전역 설정에 들어간다. hostname은 전역 설정에서, interface와 line 명령으로 각 하위 설정에 진입한다. end로 특권 EXEC 복귀 후 running-config를 startup-config로 복사한다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">라우터 모드 이동과 설정 저장</text><text x="28" y="82" font-size="21" fill="#536b70" font-weight="400" text-anchor="start">프롬프트의 괄호와 # 기호로 현재 모드를 확인</text><rect x="28" y="110" width="180" height="88" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="118" y="143" font-size="23" fill="#103b37" font-weight="700" text-anchor="middle">Router&gt;</text><text x="118" y="174" font-size="20" fill="#536b70" font-weight="400" text-anchor="middle">사용자 EXEC</text><rect x="270" y="110" width="204" height="88" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="372" y="143" font-size="23" fill="#103b37" font-weight="700" text-anchor="middle">Router#</text><text x="372" y="174" font-size="20" fill="#536b70" font-weight="400" text-anchor="middle">특권 EXEC</text><rect x="534" y="110" width="198" height="88" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="633" y="143" font-size="19" fill="#103b37" font-weight="700" text-anchor="middle">Router(config)#</text><text x="633" y="174" font-size="20" fill="#536b70" font-weight="400" text-anchor="middle">전역 설정</text><line x1="213" y1="153" x2="261" y2="153" stroke="#087a61" stroke-width="3"/><path d="M251.99552897647322,157.3496553411123 L261,153 L251.99552897647322,148.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="237" y="135" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">enable</text><line x1="480" y1="153" x2="527" y2="153" stroke="#087a61" stroke-width="3"/><path d="M517.9955289764732,157.3496553411123 L527,153 L517.9955289764732,148.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="505" y="221" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">configure terminal</text><text x="28" y="250" font-size="21" fill="#103b37" font-weight="600" text-anchor="start">전역 설정 예: hostname LAB-R1</text><line x1="633" y1="205" x2="633" y2="279" stroke="#087a61" stroke-width="3"/><line x1="230" y1="279" x2="633" y2="279" stroke="#087a61" stroke-width="3"/><line x1="230" y1="279" x2="230" y2="306" stroke="#087a61" stroke-width="3"/><path d="M225.6503446588877,296.9955289764732 L230,306 L234.3496553411123,296.9955289764732" fill="none" stroke="#087a61" stroke-width="3"/><line x1="591" y1="279" x2="591" y2="306" stroke="#087a61" stroke-width="3"/><path d="M586.6503446588877,296.9955289764732 L591,306 L595.3496553411123,296.9955289764732" fill="none" stroke="#087a61" stroke-width="3"/><rect x="28" y="317" width="333" height="83" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="195" y="350" font-size="23" fill="#103b37" font-weight="700" text-anchor="middle">Router(config-if)#</text><text x="195" y="380" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">interface FastEthernet0/0</text><rect x="382" y="317" width="350" height="83" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="557" y="350" font-size="23" fill="#103b37" font-weight="700" text-anchor="middle">Router(config-line)#</text><text x="557" y="380" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">line console 0 / line vty 0 4</text><text x="28" y="437" font-size="21" fill="#536b70" font-weight="400" text-anchor="start">각 설정 모드에서 end → 특권 EXEC(#)로 복귀</text><rect x="28" y="461" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="493" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">Router# copy running-config startup-config</text><text x="46" y="521" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">현재 실행 설정 → 시작 설정으로 복사합니다.</text></g></svg>
