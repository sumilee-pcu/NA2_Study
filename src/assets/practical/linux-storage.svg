<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">df와 du가 바라보는 범위</title><desc id="desc">df는 마운트된 파일시스템 단위의 공간 정보를 보여 준다. du는 파일과 디렉터리 트리의 공간 사용량을 집계한다. 서로 다른 관점이므로 출력이 반드시 같지 않다.</desc><rect width="760" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">df와 du가 바라보는 범위</text><text x="28" y="82" font-size="22" fill="#536b70" font-weight="400" text-anchor="start">같은 저장 공간을 서로 다른 기준으로 살펴봅니다.</text><rect x="28" y="111" width="330" height="302" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><rect x="382" y="111" width="350" height="302" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="50" y="151" font-size="26" fill="#087a61" font-weight="700" text-anchor="start">df: 파일시스템</text><text x="404" y="151" font-size="26" fill="#103b37" font-weight="700" text-anchor="start">du: 파일·디렉터리</text><rect x="65" y="185" width="256" height="84" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><rect x="65" y="185" width="164" height="84" rx="8" fill="#087a61" stroke="#dce4df" stroke-width="1.5"/><text x="146" y="234" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">사용 중</text><text x="276" y="234" font-size="22" fill="#103b37" font-weight="600" text-anchor="middle">가용</text><text x="50" y="312" font-size="22" fill="#192d33" font-weight="400" text-anchor="start">마운트된 파일시스템의</text><text x="50" y="346" font-size="22" fill="#192d33" font-weight="400" text-anchor="start">공간 정보를 확인</text><text x="50" y="383" font-size="20" fill="#087a61" font-weight="600" text-anchor="start">전체 공간 관점</text><text x="410" y="202" font-size="24" fill="#103b37" font-weight="700" text-anchor="start">project/</text><line x1="423" y1="215" x2="423" y2="318" stroke="#536b70" stroke-width="2"/><line x1="423" y1="243" x2="457" y2="243" stroke="#536b70" stroke-width="2"/><line x1="423" y1="292" x2="457" y2="292" stroke="#536b70" stroke-width="2"/><text x="468" y="250" font-size="22" fill="#192d33" font-weight="400" text-anchor="start">data.csv</text><text x="468" y="300" font-size="22" fill="#192d33" font-weight="400" text-anchor="start">images/</text><text x="404" y="346" font-size="22" fill="#192d33" font-weight="400" text-anchor="start">파일과 하위 디렉터리의</text><text x="404" y="383" font-size="22" fill="#103b37" font-weight="600" text-anchor="start">사용량을 집계</text><rect x="28" y="439" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="471" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">df와 du 출력이 항상 같은 값일 필요는 없습니다.</text><text x="46" y="499" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">이 그림은 관점 비교이며 실제 명령 실행 결과 화면은 아닙니다.</text></g></svg>
