<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">IPv6 주소 유형: 하나 · 가까운 하나 · 모두</title><desc id="desc">유니캐스트는 하나의 인터페이스, 애니캐스트는 그룹 중 라우팅 거리상 가장 가까운 하나, 멀티캐스트는 그룹의 모든 대상으로 전달한다. IPv6 주소는 128비트이며 브로드캐스트 주소는 없다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">IPv6 주소 유형: 하나 · 가까운 하나 · 모두</text><text x="28" y="82" font-size="22" fill="#536b70" font-weight="400" text-anchor="start">주소 길이 128비트 · 수신 대상을 기준으로 구분</text><rect x="28" y="112" width="704" height="98" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="143" font-size="23" fill="#103b37" font-weight="700" text-anchor="start">유니캐스트</text><text x="45" y="175" font-size="20" fill="#536b70" font-weight="400" text-anchor="start">특정 인터페이스 하나</text><rect x="360" y="144" width="50" height="34" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="385" y="168" font-size="18" fill="#103b37" font-weight="400" text-anchor="middle">송신</text><rect x="637" y="121" width="65" height="27" rx="8" fill="#087a61" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="141" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">대상 1</text><line x1="416" y1="161" x2="628" y2="134" stroke="#087a61" stroke-width="3"/><path d="M619.61720627833,139.4524095058908 L628,134 L618.5181527723802,130.82280419991497" fill="none" stroke="#087a61" stroke-width="3"/><rect x="637" y="152" width="65" height="27" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="172" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">대상 2</text><rect x="637" y="183" width="65" height="27" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="203" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">대상 3</text><rect x="28" y="222" width="704" height="98" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="253" font-size="23" fill="#103b37" font-weight="700" text-anchor="start">애니캐스트</text><text x="45" y="285" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">그룹 중 경로상 가까운 하나</text><rect x="360" y="254" width="50" height="34" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="385" y="278" font-size="18" fill="#103b37" font-weight="400" text-anchor="middle">송신</text><rect x="637" y="231" width="65" height="27" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="251" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">대상 1</text><line x1="416" y1="271" x2="628" y2="244" stroke="#dce4df" stroke-width="2" stroke-dasharray="4 5"/><rect x="637" y="262" width="65" height="27" rx="8" fill="#087a61" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="282" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">대상 2</text><line x1="416" y1="271" x2="628" y2="275" stroke="#087a61" stroke-width="3"/><path d="M618.9150769737066,279.17901586576613 L628,275 L619.0791857024695,270.48125324133156" fill="none" stroke="#087a61" stroke-width="3"/><rect x="637" y="293" width="65" height="27" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="313" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">대상 3</text><line x1="416" y1="271" x2="628" y2="306" stroke="#dce4df" stroke-width="2" stroke-dasharray="4 5"/><rect x="28" y="332" width="704" height="98" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="363" font-size="23" fill="#103b37" font-weight="700" text-anchor="start">멀티캐스트</text><text x="45" y="395" font-size="20" fill="#536b70" font-weight="400" text-anchor="start">그룹에 속한 모든 대상</text><rect x="360" y="364" width="50" height="34" rx="8" fill="#fff" stroke="#dce4df" stroke-width="1.5"/><text x="385" y="388" font-size="18" fill="#103b37" font-weight="400" text-anchor="middle">송신</text><rect x="637" y="341" width="65" height="27" rx="8" fill="#087a61" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="361" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">대상 1</text><line x1="416" y1="381" x2="628" y2="354" stroke="#087a61" stroke-width="3"/><path d="M619.61720627833,359.45240950589084 L628,354 L618.5181527723802,350.82280419991497" fill="none" stroke="#087a61" stroke-width="3"/><rect x="637" y="372" width="65" height="27" rx="8" fill="#087a61" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="392" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">대상 2</text><line x1="416" y1="381" x2="628" y2="385" stroke="#087a61" stroke-width="3"/><path d="M618.9150769737066,389.17901586576613 L628,385 L619.0791857024695,380.48125324133156" fill="none" stroke="#087a61" stroke-width="3"/><rect x="637" y="403" width="65" height="27" rx="8" fill="#087a61" stroke="#dce4df" stroke-width="1.5"/><text x="669" y="423" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">대상 3</text><line x1="416" y1="381" x2="628" y2="416" stroke="#087a61" stroke-width="3"/><path d="M618.4072769423921,418.82482996657086 L628,416 L619.824302396594,410.24170435826176" fill="none" stroke="#087a61" stroke-width="3"/><rect x="28" y="456" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="488" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">IPv6에는 브로드캐스트 주소가 없습니다.</text><text x="46" y="516" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">애니캐스트의 “가까움”은 지리적 거리가 아닌 라우팅 기준입니다.</text></g></svg>
