<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">SOA 시간: 숫자와 단위를 한 쌍으로</title><desc id="desc">Refresh 3600초는 60분, Retry 900초는 15분, Expire 86400초는 1일, MINIMUM 600초는 10분이다. SOA 레코드 자체의 TTL 3600초는 별도 항목이다.</desc><rect width="760" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">SOA 시간: 숫자와 단위를 한 쌍으로</text><text x="28" y="84" font-size="22" fill="#536b70" font-weight="400" text-anchor="start">값을 환산한 뒤 입력 칸 옆의 단위도 함께 선택</text><rect x="28" y="110" width="704" height="67" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="138" font-size="21" fill="#103b37" font-weight="700" text-anchor="start">Refresh</text><text x="45" y="163" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">새로 고침</text><text x="365" y="152" font-size="24" fill="#192d33" font-weight="600" text-anchor="middle">3600초</text><line x1="440" y1="144" x2="508" y2="144" stroke="#087a61" stroke-width="3"/><path d="M498.9955289764732,148.3496553411123 L508,144 L498.9955289764732,139.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="617" y="152" font-size="26" fill="#087a61" font-weight="700" text-anchor="middle">60분</text><rect x="28" y="187" width="704" height="67" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="215" font-size="21" fill="#103b37" font-weight="700" text-anchor="start">Retry</text><text x="45" y="240" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">다시 시도</text><text x="365" y="229" font-size="24" fill="#192d33" font-weight="600" text-anchor="middle">900초</text><line x1="440" y1="221" x2="508" y2="221" stroke="#087a61" stroke-width="3"/><path d="M498.9955289764732,225.3496553411123 L508,221 L498.9955289764732,216.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="617" y="229" font-size="26" fill="#087a61" font-weight="700" text-anchor="middle">15분</text><rect x="28" y="264" width="704" height="67" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="292" font-size="21" fill="#103b37" font-weight="700" text-anchor="start">Expire</text><text x="45" y="317" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">만료</text><text x="365" y="306" font-size="24" fill="#192d33" font-weight="600" text-anchor="middle">86400초</text><line x1="440" y1="298" x2="508" y2="298" stroke="#087a61" stroke-width="3"/><path d="M498.9955289764732,302.3496553411123 L508,298 L498.9955289764732,293.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="617" y="306" font-size="26" fill="#087a61" font-weight="700" text-anchor="middle">1일</text><rect x="28" y="341" width="704" height="67" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="369" font-size="21" fill="#103b37" font-weight="700" text-anchor="start">MINIMUM</text><text x="45" y="394" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">부정 응답 캐싱 관련</text><text x="365" y="383" font-size="24" fill="#192d33" font-weight="600" text-anchor="middle">600초</text><line x1="440" y1="375" x2="508" y2="375" stroke="#087a61" stroke-width="3"/><path d="M498.9955289764732,379.3496553411123 L508,375 L498.9955289764732,370.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="617" y="383" font-size="26" fill="#087a61" font-weight="700" text-anchor="middle">10분</text><rect x="28" y="431" width="704" height="65" rx="8" fill="#edf1f3" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="458" font-size="22" fill="#103b37" font-weight="700" text-anchor="start">SOA 레코드 자체의 TTL: 3600초 = 1시간</text><text x="45" y="484" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">MINIMUM과 별도 항목이며, 모든 레코드의 TTL을 뜻하지 않습니다.</text></g></svg>
