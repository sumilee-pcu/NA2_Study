<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">압착하기 전에 확인할 세 곳</title><desc id="desc">막힌 끝 플러그의 옆면 개념도. 정상은 도체 끝이 앞쪽 끝까지 닿고 케이블 외피가 고정부 아래에 들어간다. 불량은 도체가 덜 들어가거나 외피가 고정부 밖에 있다. 압착 전 8가닥 배열도 확인한다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">압착하기 전에 확인할 세 곳</text><text x="28" y="80" font-size="19" fill="#536b70" font-weight="400" text-anchor="start">막힌 끝 플러그의 옆면 개념도 · 도체 1가닥으로 단순화</text><text x="28" y="130" font-size="22" fill="#087a61" font-weight="700" text-anchor="start">삽입 확인</text><rect x="210" y="150" width="480" height="100" rx="12" fill="#f4f8f8" stroke="#103b37" stroke-width="1.5"/><rect x="55" y="184" width="300" height="34" rx="3" fill="#adc0c6" stroke="#adc0c6" stroke-width="1.5"/><rect x="355" y="195" width="325" height="12" rx="2" fill="#c77839" stroke="#c77839" stroke-width="1.5"/><rect x="300" y="156" width="26" height="35" rx="1" fill="#087a61" stroke="#087a61" stroke-width="1.5"/><rect x="650" y="155" width="22" height="33" rx="1" fill="#d3ad53" stroke="#d3ad53" stroke-width="1.5"/><text x="42" y="270" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">케이블 외피</text><text x="552" y="270" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">플러그 앞쪽 →</text><line x1="315" y1="140" x2="315" y2="181" stroke="#087a61" stroke-width="3"/><path d="M310.6503446588877,171.99552897647322 L315,181 L319.3496553411123,171.99552897647322" fill="none" stroke="#087a61" stroke-width="3"/><text x="365" y="133" font-size="20" fill="#087a61" font-weight="600" text-anchor="start">외피가 고정부 안쪽까지 들어감</text><line x1="680" y1="280" x2="680" y2="214" stroke="#087a61" stroke-width="3"/><path d="M684.3496553411123,223.00447102352678 L680,214 L675.6503446588877,223.00447102352678" fill="none" stroke="#087a61" stroke-width="3"/><text x="28" y="312" font-size="22" fill="#9b3c35" font-weight="700" text-anchor="start">다시 준비</text><rect x="210" y="332" width="480" height="100" rx="12" fill="#f4f8f8" stroke="#103b37" stroke-width="1.5"/><rect x="55" y="366" width="130" height="34" rx="3" fill="#adc0c6" stroke="#adc0c6" stroke-width="1.5"/><rect x="185" y="377" width="430" height="12" rx="2" fill="#c77839" stroke="#c77839" stroke-width="1.5"/><rect x="300" y="338" width="26" height="35" rx="1" fill="#087a61" stroke="#087a61" stroke-width="1.5"/><rect x="650" y="337" width="22" height="33" rx="1" fill="#d3ad53" stroke="#d3ad53" stroke-width="1.5"/><text x="42" y="452" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">케이블 외피</text><text x="552" y="452" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">플러그 앞쪽 →</text><line x1="175" y1="322" x2="175" y2="363" stroke="#9b3c35" stroke-width="3"/><path d="M170.6503446588877,353.9955289764732 L175,363 L179.3496553411123,353.9955289764732" fill="none" stroke="#9b3c35" stroke-width="3"/><text x="365" y="315" font-size="20" fill="#9b3c35" font-weight="600" text-anchor="start">외피가 고정부에 닿지 않음</text><line x1="616" y1="462" x2="616" y2="396" stroke="#9b3c35" stroke-width="3"/><path d="M620.3496553411123,405.0044710235268 L616,396 L611.6503446588877,405.0044710235268" fill="none" stroke="#9b3c35" stroke-width="3"/><text x="28" y="479" font-size="20" fill="#9b3c35" font-weight="600" text-anchor="start">도체 끝이 앞쪽에 닿지 않음</text><rect x="28" y="496" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="528" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">압착 전: 8가닥 배열 · 끝까지 삽입 · 외피 고정을 함께 확인</text><text x="46" y="556" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">절단 길이와 통과형 플러그의 마무리는 해당 제품 설명을 따릅니다.</text></g></svg>
