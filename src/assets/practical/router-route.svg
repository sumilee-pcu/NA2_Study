<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">목적지와 다음 홉을 구분하기</title><desc id="desc">R1 10.0.12.1은 연결망 10.0.12.0/30의 이웃 R2 10.0.12.2를 다음 홉으로 삼아 192.168.20.0/24로 가는 정적 경로를 설정한다. 구성 개념이며 통신 검증 결과가 아니다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">목적지와 다음 홉을 구분하기</text><text x="28" y="83" font-size="22" fill="#536b70" font-weight="400" text-anchor="start">R1에서 원격 네트워크로 가는 정적 경로의 의미</text><rect x="28" y="132" width="155" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="105" y="172" font-size="31" fill="#087a61" font-weight="700" text-anchor="middle">R1</text><text x="105" y="218" font-size="21" fill="#103b37" font-weight="600" text-anchor="middle">10.0.12.1</text><rect x="327" y="132" width="155" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="405" y="172" font-size="31" fill="#087a61" font-weight="700" text-anchor="middle">R2</text><text x="405" y="218" font-size="21" fill="#103b37" font-weight="600" text-anchor="middle">10.0.12.2</text><line x1="188" y1="185" x2="318" y2="185" stroke="#087a61" stroke-width="3"/><path d="M308.9955289764732,189.3496553411123 L318,185 L308.9955289764732,180.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="253" y="151" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">10.0.12.0/30</text><text x="253" y="223" font-size="19" fill="#536b70" font-weight="400" text-anchor="middle">연결망</text><rect x="571" y="132" width="161" height="116" rx="8" fill="#edf1f3" stroke="#dce4df" stroke-width="1.5"/><text x="651" y="170" font-size="23" fill="#103b37" font-weight="700" text-anchor="middle">목적지 망</text><text x="651" y="210" font-size="18" fill="#37658b" font-weight="600" text-anchor="middle">192.168.20.0</text><text x="651" y="237" font-size="21" fill="#37658b" font-weight="700" text-anchor="middle">/24</text><line x1="488" y1="185" x2="561" y2="185" stroke="#087a61" stroke-width="3"/><path d="M551.9955289764732,189.3496553411123 L561,185 L551.9955289764732,180.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><text x="28" y="300" font-size="22" fill="#103b37" font-weight="700" text-anchor="start">R1(config)#</text><rect x="28" y="318" width="704" height="68" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="45" y="361" font-size="21" fill="#103b37" font-weight="600" text-anchor="start">ip route</text><text x="158" y="361" font-size="21" fill="#37658b" font-weight="600" text-anchor="start">192.168.20.0</text><text x="370" y="361" font-size="21" fill="#37658b" font-weight="600" text-anchor="start">255.255.255.0</text><text x="585" y="361" font-size="21" fill="#087a61" font-weight="600" text-anchor="start">10.0.12.2</text><text x="229" y="420" font-size="20" fill="#37658b" font-weight="700" text-anchor="middle">목적지</text><text x="445" y="420" font-size="20" fill="#37658b" font-weight="700" text-anchor="middle">목적지 마스크</text><text x="635" y="420" font-size="20" fill="#087a61" font-weight="700" text-anchor="middle">다음 홉</text><rect x="28" y="446" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="478" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">다음 홉은 R1 자신이 아닌, 이웃 R2의 연결 주소</text><text x="46" y="506" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">구성 개념도입니다. 에뮬레이터의 실제 통신 성공을 뜻하지 않습니다.</text></g></svg>
