<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">일반 파일의 Linux 권한 755 해석</title>
  <desc id="desc">일반 파일의 모드 표기 -rwxr-xr-x에서 첫 하이픈은 일반 파일을 뜻합니다. 다음 세 묶음은 소유자 rwx로 4+2+1=7, 소유 그룹 r-x로 4+0+1=5, 그 외 사용자 r-x로 4+0+1=5입니다. 권한 자리의 하이픈은 해당 권한 비트가 없음을 뜻합니다. 이 그림은 기본 비트 해석이며 ACL 등 추가 접근 제어를 포함한 실제 접근 결과를 보장하지 않습니다.</desc>
  <rect width="760" height="520" fill="#fff"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif" fill="#192d33">
    <text x="32" y="47" font-size="29" font-weight="700" fill="#103b37">755를 소유자·그룹·기타로 나누기</text>
    <text x="32" y="80" font-size="20" fill="#536b70">일반 파일의 기본 권한 비트 세 묶음을 해석합니다.</text>
    <text x="32" y="126" font-size="21" fill="#536b70">모드 표기</text>
    <text x="427" y="129" font-size="37" font-weight="700" font-family="Consolas, monospace" fill="#087a61" text-anchor="middle">-rwxr-xr-x</text>
    <rect x="32" y="153" width="216" height="251" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/>
    <rect x="272" y="153" width="216" height="251" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/>
    <rect x="512" y="153" width="216" height="251" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/>
    <g text-anchor="middle">
      <g font-size="22" font-weight="700" fill="#103b37"><text x="140" y="191">소유자 u</text><text x="380" y="191">소유 그룹 g</text><text x="620" y="191">그 외 사용자 o</text></g>
      <g font-size="43" font-weight="700" font-family="Consolas, monospace" fill="#087a61"><text x="140" y="245">rwx</text><text x="380" y="245">r-x</text><text x="620" y="245">r-x</text></g>
      <g font-size="25" fill="#536b70"><text x="140" y="286">4 + 2 + 1</text><text x="380" y="286">4 + 0 + 1</text><text x="620" y="286">4 + 0 + 1</text></g>
      <g font-size="48" font-weight="700" fill="#087a61"><text x="140" y="345">7</text><text x="380" y="345">5</text><text x="620" y="345">5</text></g>
      <g font-size="21"><text x="140" y="382">읽기·쓰기·실행</text><text x="380" y="382">읽기·실행</text><text x="620" y="382">읽기·실행</text></g>
    </g>
    <text x="32" y="443" font-size="22" font-weight="700" fill="#103b37">r = 4 읽기     w = 2 쓰기     x = 1 실행</text>
    <text x="32" y="474" font-size="19" fill="#536b70">첫 -는 일반 파일 · 권한 자리의 -는 해당 비트가 없음</text>
    <text x="32" y="503" font-size="17" fill="#536b70">기본 비트의 해석입니다. ACL 등 실제 접근 조건은 별도로 확인합니다.</text>
  </g>
</svg>
