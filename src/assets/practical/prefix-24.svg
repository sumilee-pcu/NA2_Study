<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">/24를 서브넷 마스크로 바꾸기</title>
  <desc id="desc">IPv4 마스크의 앞 24비트는 1, 뒤 8비트는 0입니다. 8비트씩 묶으면 11111111, 11111111, 11111111, 00000000입니다. 1인 자리의 값 128, 64, 32, 16, 8, 4, 2, 1을 더하면 255이며 마지막 묶음은 0이므로 마스크는 255.255.255.0입니다.</desc>
  <rect width="760" height="520" fill="#fff"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif" fill="#192d33">
    <text x="32" y="47" font-size="29" font-weight="700" fill="#103b37">/24를 서브넷 마스크로 바꾸기</text>
    <text x="32" y="81" font-size="20" fill="#536b70">32비트를 8비트씩 나누고, 각 묶음을 10진수로 변환합니다.</text>
    <path d="M32 124 V111 H552 V124" fill="none" stroke="#087a61" stroke-width="2"/>
    <text x="292" y="104" font-size="20" font-weight="700" fill="#087a61" text-anchor="middle">네트워크 부분 · 앞 24비트는 1</text>
    <path d="M560 124 V111 H728 V124" fill="none" stroke="#536b70" stroke-width="2"/>
    <text x="644" y="104" font-size="19" text-anchor="middle" fill="#536b70">호스트 8비트는 0</text>
    <g stroke="#dce4df" stroke-width="1.5">
      <rect x="32" y="136" width="168" height="142" rx="8" fill="#e7f3ec"/>
      <rect x="208" y="136" width="168" height="142" rx="8" fill="#e7f3ec"/>
      <rect x="384" y="136" width="168" height="142" rx="8" fill="#e7f3ec"/>
      <rect x="560" y="136" width="168" height="142" rx="8" fill="#f3f5f2"/>
    </g>
    <g text-anchor="middle">
      <g font-size="18" fill="#536b70"><text x="116" y="162">첫째 옥텟</text><text x="292" y="162">둘째 옥텟</text><text x="468" y="162">셋째 옥텟</text><text x="644" y="162">넷째 옥텟</text></g>
      <g font-family="Consolas, monospace" font-size="27" font-weight="700"><text x="116" y="201">11111111</text><text x="292" y="201">11111111</text><text x="468" y="201">11111111</text><text x="644" y="201">00000000</text></g>
      <g fill="none" stroke="#536b70" stroke-width="2"><path d="M116 211 V230 m-5-5 5 5 5-5"/><path d="M292 211 V230 m-5-5 5 5 5-5"/><path d="M468 211 V230 m-5-5 5 5 5-5"/><path d="M644 211 V230 m-5-5 5 5 5-5"/></g>
      <g font-size="31" font-weight="700" fill="#087a61"><text x="116" y="264">255</text><text x="292" y="264">255</text><text x="468" y="264">255</text><text x="644" y="264" fill="#536b70">0</text></g>
    </g>
    <rect x="32" y="301" width="696" height="80" rx="8" fill="#f3f5f2"/>
    <text x="48" y="327" font-size="19" font-weight="700" fill="#103b37">1인 자리의 값을 더합니다.</text>
    <text x="48" y="358" font-size="25" font-family="Consolas, monospace">128+64+32+16+8+4+2+1 = 255</text>
    <text x="380" y="443" font-size="39" font-family="Consolas, monospace" font-weight="700" fill="#087a61" text-anchor="middle">255.255.255.0</text>
    <text x="380" y="486" font-size="20" fill="#536b70" text-anchor="middle">/24는 주소의 값이 아니라 네트워크 접두 길이를 뜻합니다.</text>
  </g>
</svg>
