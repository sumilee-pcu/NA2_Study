<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">주소 풀에서 제외 범위를 빼기</title><desc id="desc">AI-LAB 주소 풀 .1에서 .126의 126개 중 .1에서 .10까지 10개를 제외한다. 후보는 .11에서 .126까지 116개이다. 임대 기간 0일 6시간 0분이며 이번 범위는 비활성 상태이다.</desc><rect width="760" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">주소 풀에서 제외 범위를 빼기</text><text x="28" y="84" font-size="23" fill="#087a61" font-weight="700" text-anchor="start">범위 AI-LAB · 192.168.100.1 ~ 192.168.100.126</text><text x="28" y="121" font-size="21" fill="#536b70" font-weight="400" text-anchor="start">/25 → 255.255.255.128 · 범위 양 끝을 포함하여 계산</text><rect x="28" y="156" width="704" height="85" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="380" y="190" font-size="21" fill="#103b37" font-weight="600" text-anchor="middle">구성한 주소 풀</text><text x="380" y="222" font-size="25" fill="#103b37" font-weight="700" text-anchor="middle">.1 ~ .126 : 126개</text><line x1="205" y1="245" x2="205" y2="279" stroke="#087a61" stroke-width="3"/><path d="M200.6503446588877,269.9955289764732 L205,279 L209.3496553411123,269.9955289764732" fill="none" stroke="#087a61" stroke-width="3"/><line x1="520" y1="245" x2="520" y2="279" stroke="#087a61" stroke-width="3"/><path d="M515.6503446588877,269.9955289764732 L520,279 L524.3496553411123,269.9955289764732" fill="none" stroke="#087a61" stroke-width="3"/><rect x="28" y="292" width="260" height="112" rx="8" fill="#fff1ed" stroke="#dce4df" stroke-width="1.5"/><text x="158" y="329" font-size="22" fill="#9b3c35" font-weight="700" text-anchor="middle">배포 제외</text><text x="158" y="368" font-size="25" fill="#9b3c35" font-weight="600" text-anchor="middle">.1 ~ .10 : 10개</text><rect x="308" y="292" width="424" height="112" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="520" y="329" font-size="22" fill="#087a61" font-weight="700" text-anchor="middle">제외 후 후보</text><text x="520" y="368" font-size="25" fill="#087a61" font-weight="700" text-anchor="middle">.11 ~ .126 : 116개</text><rect x="28" y="429" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="461" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">126 − 10 = 116개 · 임대 기간 0일 6시간 0분</text><text x="46" y="489" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">이번 과제는 비활성 범위입니다. 후보 주소 수는 실제 임대 수가 아닙니다.</text></g></svg>
