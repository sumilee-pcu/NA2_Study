<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">CNAME에서 A 레코드로 이어지는 관계</title><desc id="desc">www.lab.example 별칭이 CNAME으로 web01.lab.example를 가리키고, 그 호스트의 A 레코드가 192.168.60.20을 가리킨다. 조회할 DNS 서버 주소 192.168.60.2는 레코드 주소와 별개이다.</desc><rect width="760" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">CNAME에서 A 레코드로 이어지는 관계</text><text x="28" y="83" font-size="23" fill="#536b70" font-weight="400" text-anchor="start">정방향 조회 영역: lab.example</text><rect x="28" y="117" width="454" height="88" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="50" y="147" font-size="19" fill="#536b70" font-weight="400" text-anchor="start">별칭 이름</text><text x="50" y="184" font-size="28" fill="#087a61" font-weight="700" text-anchor="start">www.lab.example</text><rect x="28" y="247" width="454" height="88" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="50" y="277" font-size="19" fill="#536b70" font-weight="400" text-anchor="start">정규 호스트 이름</text><text x="50" y="314" font-size="28" fill="#103b37" font-weight="700" text-anchor="start">web01.lab.example</text><rect x="28" y="377" width="454" height="88" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="50" y="407" font-size="19" fill="#536b70" font-weight="400" text-anchor="start">IPv4 주소</text><text x="50" y="444" font-size="28" fill="#37658b" font-weight="700" text-anchor="start">192.168.60.20</text><line x1="255" y1="211" x2="255" y2="241" stroke="#087a61" stroke-width="3"/><path d="M250.6503446588877,231.99552897647322 L255,241 L259.3496553411123,231.99552897647322" fill="none" stroke="#087a61" stroke-width="3"/><line x1="255" y1="341" x2="255" y2="371" stroke="#087a61" stroke-width="3"/><path d="M250.6503446588877,361.9955289764732 L255,371 L259.3496553411123,361.9955289764732" fill="none" stroke="#087a61" stroke-width="3"/><text x="284" y="235" font-size="21" fill="#087a61" font-weight="700" text-anchor="start">CNAME</text><text x="284" y="365" font-size="21" fill="#37658b" font-weight="700" text-anchor="start">A</text><rect x="506" y="117" width="226" height="348" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="619" y="156" font-size="20" fill="#103b37" font-weight="600" text-anchor="middle">조회할 DNS 서버</text><text x="619" y="195" font-size="22" fill="#087a61" font-weight="700" text-anchor="middle">192.168.60.2</text><text x="526" y="250" font-size="21" fill="#192d33" font-weight="400" text-anchor="start">레코드의 IP와</text><text x="526" y="280" font-size="21" fill="#192d33" font-weight="400" text-anchor="start">DNS 서버의 IP를</text><text x="526" y="310" font-size="21" fill="#192d33" font-weight="400" text-anchor="start">구분하세요.</text><text x="526" y="372" font-size="20" fill="#536b70" font-weight="400" text-anchor="start">CNAME 대상은</text><text x="526" y="402" font-size="20" fill="#103b37" font-weight="700" text-anchor="start">IP가 아닌 이름</text><text x="28" y="507" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">이름 사이의 참조 관계입니다. 실제 응답 성공을 나타내는 그림은 아닙니다.</text></g></svg>
