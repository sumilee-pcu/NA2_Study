<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">시험기 결과를 핀 번호로 읽기</title><desc id="desc">다이렉트 결선의 정상 1대1 연결, 3번 단선, 1번과 2번의 뒤바뀜을 비교한다. 단순 도통만으로 split pair와 전송 성능을 모두 확인할 수는 없다. 의도한 크로스 결선은 그 와이어맵과 비교한다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">시험기 결과를 핀 번호로 읽기</text><text x="28" y="80" font-size="19" fill="#536b70" font-weight="400" text-anchor="start">왼쪽 핀 → 오른쪽 핀 · 다이렉트 결선을 요구한 예</text><rect x="28" y="101" width="224" height="295" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="140" y="135" font-size="22" fill="#087a61" font-weight="700" text-anchor="middle">정상 연결</text><text x="56" y="190" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">1</text><text x="223" y="190" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">1</text><line x1="76" y1="184" x2="203" y2="184" stroke="#087a61" stroke-width="2"/><text x="56" y="216" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">2</text><text x="223" y="216" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">2</text><line x1="76" y1="210" x2="203" y2="210" stroke="#087a61" stroke-width="2"/><text x="56" y="242" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">3</text><text x="223" y="242" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">3</text><line x1="76" y1="236" x2="203" y2="236" stroke="#087a61" stroke-width="2"/><text x="56" y="268" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">4</text><text x="223" y="268" font-size="18" fill="#192d33" font-weight="600" text-anchor="middle">4</text><line x1="76" y1="262" x2="203" y2="262" stroke="#087a61" stroke-width="2"/><text x="56" y="294" font-size="18" fill=