83" y2="366" stroke="#087a61" stroke-width="2"/><rect x="28" y="414" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="446" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">1→1 도통이 맞아도 꼬임쌍이 잘못된 split pair는 남을 수 있음</text><text x="46" y="474" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">쌍 검출 지원 여부와 전송 성능은 시험기 사양에 따라 확인합니다.</text><text x="28" y="545" font-size="20" fill="#536b70" font-weight="400" text-anchor="start">의도한 크로스 결선은 해당 와이어맵을 기준으로 판정합니다.</text></g></svg>
