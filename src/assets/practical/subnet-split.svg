<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">/16을 /19로 나누면 몇 블록일까?</title><desc id="desc">172.16.0.0/16을 /19로 나누면 3비트를 더 사용하므로 8개 블록이다. 셋째 옥텟 시작값은 0,32,64,96,128,160,192,224이며 각 블록의 전체 주소는 8192개이다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">/16을 /19로 나누면 몇 블록일까?</text><text x="28" y="86" font-size="26" fill="#087a61" font-weight="700" text-anchor="start">172.16.0.0/16 → 같은 크기의 /19 블록</text><text x="28" y="126" font-size="23" fill="#103b37" font-weight="600" text-anchor="start">추가한 네트워크 비트: 19 − 16 = 3비트</text><rect x="28" y="152" width="704" height="57" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="380" y="190" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">블록 수 2³ = 8개</text><rect x="28" y="238" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="110" y="269" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">1번 블록</text><text x="110" y="299" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.0.0</text><text x="110" y="322" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="208" y="238" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="290" y="269" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">2번 블록</text><text x="290" y="299" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.32.0</text><text x="290" y="322" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="388" y="238" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="470" y="269" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">3번 블록</text><text x="470" y="299" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.64.0</text><text x="470" y="322" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="568" y="238" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="650" y="269" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">4번 블록</text><text x="650" y="299" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.96.0</text><text x="650" y="322" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="28" y="348" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="110" y="379" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">5번 블록</text><text x="110" y="409" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.128.0</text><text x="110" y="432" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="208" y="348" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="290" y="379" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">6번 블록</text><text x="290" y="409" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.160.0</text><text x="290" y="432" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="388" y="348" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="470" y="379" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">7번 블록</text><text x="470" y="409" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.192.0</text><text x="470" y="432" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="568" y="348" width="164" height="91" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="650" y="379" font-size="18" fill="#536b70" font-weight="400" text-anchor="middle">8번 블록</text><text x="650" y="409" font-size="19" fill="#103b37" font-weight="600" text-anchor="middle">172.16.224.0</text><text x="650" y="432" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">/19</text><rect x="28" y="468" width="704" height="76" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="500" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">각 /19 블록의 전체 주소: 2¹³ = 8192개</text><text x="46" y="528" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">셋째 옥텟의 시작값은 0, 32, 64, …, 224입니다.</text></g></svg>
