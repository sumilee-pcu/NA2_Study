<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">Linux 설정 파일의 역할 구분</title><desc id="desc">/etc/services는 서비스 이름과 포트 및 프로토콜을 대응시킨다. 등록 항목이 있어도 서비스 실행 중을 뜻하지 않는다. shadow 방식에서 /etc/passwd는 계정 정보를, /etc/shadow는 암호 해시 등을 보관한다.</desc><rect width="760" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">Linux 설정 파일의 역할 구분</text><text x="28" y="82" font-size="22" fill="#536b70" font-weight="400" text-anchor="start">파일에 저장된 정보와 실제 서비스 동작은 별개</text><rect x="28" y="111" width="704" height="136" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="48" y="148" font-size="27" fill="#087a61" font-weight="700" text-anchor="start">/etc/services</text><text x="48" y="186" font-size="24" fill="#103b37" font-weight="600" text-anchor="start">서비스 이름 ↔ 포트 번호 / 전송 프로토콜</text><text x="48" y="222" font-size="21" fill="#536b70" font-weight="400" text-anchor="start">예: ssh  22/tcp  ·  항목 존재 ≠ 서비스 실행 중</text><rect x="28" y="277" width="322" height="146" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="48" y="317" font-size="26" fill="#103b37" font-weight="700" text-anchor="start">/etc/passwd</text><text x="48" y="354" font-size="23" fill="#192d33" font-weight="400" text-anchor="start">로그인 계정 정보</text><text x="48" y="392" font-size="18" fill="#536b70" font-weight="400" text-anchor="start">shadow 방식의 암호 칸: x</text><line x1="358" y1="347" x2="398" y2="347" stroke="#087a61" stroke-width="3"/><path d="M388.9955289764732,351.3496553411123 L398,347 L388.9955289764732,342.6503446588877" fill="none" stroke="#087a61" stroke-width="3"/><rect x="410" y="277" width="322" height="146" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="430" y="317" font-size="26" fill="#103b37" font-weight="700" text-anchor="start">/etc/shadow</text><text x="430" y="354" font-size="23" fill="#192d33" font-weight="400" text-anchor="start">암호 해시 등</text><text x="430" y="392" font-size="19" fill="#536b70" font-weight="400" text-anchor="start">접근 권한이 제한된 파일</text><rect x="28" y="449" width="704" height="52" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="481" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">/etc/passwd의 역할을 “암호 해시 저장”으로 외우지 않기</text></g></svg>
