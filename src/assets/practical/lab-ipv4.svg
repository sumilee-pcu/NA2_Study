<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">/29 블록에서 각 주소의 역할</title><desc id="desc">서버 192.168.50.18/29의 네트워크 주소는 .16, 브로드캐스트는 .23, 호스트는 .17에서 .22까지이다. .17은 게이트웨이, .18은 서버, .19는 DNS로 지정한다.</desc><rect width="760" height="520" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">/29 블록에서 각 주소의 역할</text><text x="28" y="87" font-size="28" fill="#087a61" font-weight="700" text-anchor="start">서버 192.168.50.18/29</text><text x="28" y="124" font-size="22" fill="#536b70" font-weight="400" text-anchor="start">마스크 255.255.255.248 · 호스트 부분 3비트</text><rect x="28" y="152" width="704" height="70" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="380" y="196" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">192.168.50.16 ~ 192.168.50.23</text><rect x="28" y="256" width="82" height="116" rx="8" fill="#edf1f3" stroke="#dce4df" stroke-width="1.5"/><text x="69" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.16</text><text x="69" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">네트워크</text><rect x="116" y="256" width="82" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="157" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.17</text><text x="157" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">GW</text><rect x="204" y="256" width="82" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="245" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.18</text><text x="245" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">서버</text><rect x="292" y="256" width="82" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="333" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.19</text><text x="333" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">DNS</text><rect x="380" y="256" width="82" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="421" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.20</text><text x="421" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">호스트</text><rect x="468" y="256" width="82" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="509" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.21</text><text x="509" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">호스트</text><rect x="556" y="256" width="82" height="116" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="597" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.22</text><text x="597" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">호스트</text><rect x="644" y="256" width="82" height="116" rx="8" fill="#edf1f3" stroke="#dce4df" stroke-width="1.5"/><text x="685" y="296" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">.23</text><text x="685" y="330" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">브로드</text><text x="685" y="354" font-size="18" fill="#192d33" font-weight="400" text-anchor="middle">캐스트</text><line x1="121" y1="390" x2="640" y2="390" stroke="#087a61" stroke-width="3"/><text x="380" y="427" font-size="21" fill="#087a61" font-weight="600" text-anchor="middle">호스트: .17 ~ .22 · GW = 기본 게이트웨이</text><rect x="28" y="452" width="704" height="52" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="46" y="484" font-size="20" fill="#103b37" font-weight="600" text-anchor="start">전체 8개 − 양 끝의 2개 = 호스트 주소 6개</text></g></svg>
