<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">/18: 비트 AND로 네트워크 주소 찾기</title><desc id="desc">128.148.210.12/18의 셋째 옥텟 210은 11010010, 마스크 192는 11000000이다. AND 결과 192이고 호스트 부분을 0으로 만들면 네트워크 주소는 128.148.192.0이다. 호스트 14비트이므로 전체 주소는 16384개이다.</desc><rect width="760" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif"><text x="28" y="45" font-size="27" fill="#103b37" font-weight="700" text-anchor="start">/18: 비트 AND로 네트워크 주소 찾기</text><text x="28" y="85" font-size="29" fill="#087a61" font-weight="700" text-anchor="start">128.148.210.12/18</text><text x="28" y="122" font-size="21" fill="#536b70" font-weight="400" text-anchor="start">마스크 255.255.192.0 · 셋째 옥텟에 경계</text><text x="28" y="199" font-size="22" fill="#103b37" font-weight="400" text-anchor="start">주소의 210</text><rect x="282" y="170" width="46" height="44" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="305" y="201" font-size="25" fill="#087a61" font-weight="600" text-anchor="middle">1</text><rect x="335" y="170" width="46" height="44" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="358" y="201" font-size="25" fill="#087a61" font-weight="600" text-anchor="middle">1</text><rect x="388" y="170" width="46" height="44" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="411" y="201" font-size="25" fill="#536b70" font-weight="600" text-anchor="middle">0</text><rect x="441" y="170" width="46" height="44" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="464" y="201" font-size="25" fill="#536b70" font-weight="600" text-anchor="middle">1</text><rect x="494" y="170" width="46" height="44" rx="8" fill="#f3f5f2" stroke="#dce4df" stroke-width="1.5"/><text x="517" y="201" font-size="25" fill="#536b70" font-weight="600" text-anchor="middle">0</text><rect x="547" y="170" width="46" height="44" rx="8" fill="#f3f5f2