><text x="328" y="158" font-size="18" fill="#087a61" font-weight="600" text-anchor="middle">망</text><text x="558" y="158" font-size="18" fill="#536b70" font-weight="600" text-anchor="middle">호스트</text><rect x="28" y="378" width="704" height="64" rx="8" fill="#e7f3ec" stroke="#dce4df" stroke-width="1.5"/><text x="380" y="420" font-size="27" fill="#103b37" font-weight="700" text-anchor="middle">네트워크 주소 = 128.148.192.0</text><text x="28" y="480" font-size="23" fill="#087a61" font-weight="700" text-anchor="start">호스트 부분 14비트 → 전체 주소 2¹⁴ = 16384개</text><text x="28" y="521" font-size="20" fill="#536b70" font-weight="400" text-anchor="start">셋째 옥텟의 증분 64를 전체 주소 수로 읽지 않습니다.</text></g></svg>
